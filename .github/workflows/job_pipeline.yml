name: Autonomous Job Pipeline

on:
  schedule:
    # 8:00 AM IST is 02:30 UTC
    # 8:00 PM IST is 14:30 UTC
    - cron: '30 2,14 * * *'
  workflow_dispatch:
    inputs:
      max_details:
        description: 'Max job detail pages to scrape'
        required: false
        default: '25'
      min_score:
        description: 'Minimum match score threshold'
        required: false
        default: '8.0'
      skip_scrape:
        description: 'Skip scraping phase (process/alert only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Tectonic LaTeX Engine
        run: |
          echo "Installing prebuilt Tectonic binary..."
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Execute Autonomous Job Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.skip_scrape }}" = "true" ]; then
            EXTRA_FLAGS="--skip-scrape"
          fi
          MAX_DET="${{ github.event.inputs.max_details || '25' }}"
          MIN_SC="${{ github.event.inputs.min_score || '7.0' }}"

          python scraper/app/pipeline_runner.py --max-details "$MAX_DET" --min-score "$MIN_SC" $EXTRA_FLAGS

      - name: Commit & Push Updated Jobs Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/data/jobs.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(db): sync jobs database [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
